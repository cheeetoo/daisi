<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=IBM+Plex+Mono:wght@600&amp;family=Schibsted+Grotesk:wght@700&amp;family=Archivo:wght@700&amp;family=Young+Serif&amp;family=DM+Mono:wght@400&amp;display=swap">
  <style>
    body { margin: 0; background: #fbfbf9; color: #1a1a1a; font-family: 'IBM Plex Mono', Menlo, monospace; -webkit-font-smoothing: antialiased; }
    x-dc { display: block; }
    a { color: #00693e; text-decoration: none; }
    a:hover { color: #004a2c; text-decoration: underline; }
  </style>
</helmet>
<div style="width: 1280px; background: #fbfbf9; padding: 40px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 64px; letter-spacing: 0.08em; color: #1a1a1a; padding-left: 0.08em;">DAISI</div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">A · Serif, tracked capitals</div>
  </div>

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 44px; font-weight: 600; letter-spacing: 0.32em; color: #1a1a1a; padding-left: 0.32em;">DAISI</div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">B · Monospace, wide tracking</div>
  </div>

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 80px; color: #00693e; letter-spacing: -0.01em;">daisi</div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">C · Serif italic, lowercase, green</div>
  </div>

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 16px;">
      <svg width="56" height="56" viewBox="0 0 32 32" fill="none" stroke="#00693e" stroke-width="1.4" aria-hidden="true">
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(45 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(90 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(135 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(180 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(225 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(270 16 16)"></ellipse>
        <ellipse cx="16" cy="7.5" rx="3" ry="6.5" fill="#ffffff" transform="rotate(315 16 16)"></ellipse>
        <circle cx="16" cy="16" r="4" fill="#f5dc69"></circle>
      </svg>
      <span style="font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 46px; font-weight: 700; letter-spacing: 0.02em; color: #1a1a1a;">DAISI</span>
    </div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">D · Line daisy mark + grotesk</div>
  </div>

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <span style="font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 60px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: #1a1a1a;">DAISI</span>
      <span style="font-family: 'DM Mono', Menlo, monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #5a5a56; padding-left: 0.22em;">Dartmouth AI Safety Initiative for Students</span>
    </div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">E · Tight grotesk + full name</div>
  </div>

  <div style="background: #ffffff; border: 1px solid #e2e2dc; height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 16px;">
      <div style="width: 64px; height: 64px; background: #00693e; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
        <svg width="44" height="44" viewBox="0 0 32 32" fill="#ffffff" stroke="none" aria-hidden="true">
          <ellipse cx="16" cy="7" rx="3.2" ry="7"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(45 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(90 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(135 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(180 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(225 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(270 16 16)"></ellipse>
          <ellipse cx="16" cy="7" rx="3.2" ry="7" transform="rotate(315 16 16)"></ellipse>
          <circle cx="16" cy="16" r="4.5" fill="#c4dd88"></circle>
        </svg>
      </div>
      <span style="font-family: 'Young Serif', Georgia, serif; font-size: 50px; color: #12312b; letter-spacing: -0.01em;">daisi</span>
    </div>
    <div style="font-family: 'DM Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a56;">F · Solid daisy tile + Young Serif</div>
  </div>

</div>
</x-dc>
</body>
</html>
